name: Tailor Actions pilot
on:
  push:
    branches: ['feature/github-actions-smoke']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted checks first; other modes require buildfarm credentials/runners
        type: choice
        options: [validate, graph, packages, release]
        default: validate
      maintain_sources:
        description: Write the test_meta/master hook against this feature label
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  builders:
    if: >-
      github.event_name != 'pull_request' &&
      !(github.event_name == 'workflow_dispatch' && inputs.maintain_sources && inputs.mode == 'validate')
    permissions:
      contents: read
      packages: write
    uses: locusrobotics/tailor-meta/.github/workflows/toolchain-images.yaml@e521cb11fafde92060d1bf9632e9899e3048d55f
    with:
      tailor_meta: e521cb11fafde92060d1bf9632e9899e3048d55f
  ci:
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.maintain_sources && inputs.mode == 'validate')
    uses: locusrobotics/tailor-meta/.github/workflows/ci.yaml@e521cb11fafde92060d1bf9632e9899e3048d55f
    with:
      tailor_meta: e521cb11fafde92060d1bf9632e9899e3048d55f
  tailor:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'validate'
    needs: builders
    uses: locusrobotics/tailor-meta/.github/workflows/distribution.yaml@e521cb11fafde92060d1bf9632e9899e3048d55f
    with:
      tailor_meta: e521cb11fafde92060d1bf9632e9899e3048d55f
      mode: ${{ inputs.mode || 'validate' }}
    secrets: inherit
  source-stubs:
    needs: tailor
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.maintain_sources &&
      (needs.tailor.result == 'success' || needs.tailor.result == 'skipped')
    uses: locusrobotics/tailor-meta/.github/workflows/maintain-sources.yaml@a50b218b04d943ab6a03d31a422675cf83c5b452
    with:
      tailor_meta: a50b218b04d943ab6a03d31a422675cf83c5b452
      apply: true
      allow_feature: true
    secrets: inherit
