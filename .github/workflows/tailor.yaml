name: Tailor Actions pilot
on:
  push:
    branches: ['feature/github-actions-smoke']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted checks first; other modes require buildfarm credentials/runners
        type: choice
        options: [validate, graph, packages, release]
        default: validate
permissions:
  contents: read
jobs:
  builders:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: locusrobotics/tailor-meta/.github/workflows/toolchain-images.yaml@9bf469df0b1b890e64fb04fcb79016a9101ad13e
    with:
      tailor_meta: 9bf469df0b1b890e64fb04fcb79016a9101ad13e
  ci:
    uses: locusrobotics/tailor-meta/.github/workflows/ci.yaml@9bf469df0b1b890e64fb04fcb79016a9101ad13e
    with:
      tailor_meta: 9bf469df0b1b890e64fb04fcb79016a9101ad13e
  tailor:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'validate'
    needs: builders
    uses: locusrobotics/tailor-meta/.github/workflows/distribution.yaml@9bf469df0b1b890e64fb04fcb79016a9101ad13e
    with:
      tailor_meta: 9bf469df0b1b890e64fb04fcb79016a9101ad13e
      mode: ${{ inputs.mode || 'validate' }}
    secrets: inherit
