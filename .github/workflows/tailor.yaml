name: Tailor Actions pilot
on:
  push:
    branches: ['feature/github-actions-smoke']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted checks first; other modes require buildfarm credentials/runners
        type: choice
        options: [validate, graph, packages, release]
        default: validate
permissions:
  contents: read
jobs:
  tailor:
    uses: locusrobotics/tailor-meta/.github/workflows/distribution.yaml@36bc0b98582fa531d6a636c14b13375dee09289a
    with:
      tailor_meta: 36bc0b98582fa531d6a636c14b13375dee09289a
      mode: ${{ inputs.mode || 'validate' }}
    secrets: inherit
  smoke:
    uses: locusrobotics/tailor-meta/.github/workflows/smoke.yaml@36bc0b98582fa531d6a636c14b13375dee09289a
    with:
      tailor_meta: 36bc0b98582fa531d6a636c14b13375dee09289a
