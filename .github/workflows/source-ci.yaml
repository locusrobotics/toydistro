name: Central source CI pilot
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['feature/github-actions-smoke']
    paths: ['.github/workflows/source-ci.yaml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover only; do not write statuses/state or upload inputs
        type: boolean
        default: true
      retry_failed:
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
jobs:
  poll:
    if: github.event_name == 'workflow_dispatch' || vars.SOURCE_CI_ENABLED == 'true'
    uses: locusrobotics/tailor-meta/.github/workflows/source-poll.yaml@ac4a18f83cbd3546716699c8f52bd59f33c589c5
    with:
      tailor_meta: ac4a18f83cbd3546716699c8f52bd59f33c589c5
      configuration_ref: refs/heads/feature/github-actions-smoke
      source_repositories: '["locusrobotics/test_meta"]'
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      retry_failed: ${{ inputs.retry_failed || false }}
      allow_public_inputs: ${{ vars.SOURCE_CI_PUBLIC_INPUTS == 'true' }}
    secrets:
      SOURCE_CI_GITHUB_TOKEN: ${{ secrets.SOURCE_CI_GITHUB_TOKEN }}
